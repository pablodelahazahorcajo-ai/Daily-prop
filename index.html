<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Prop Trading</title>
</head>
<body style="font-family: Arial; padding: 20px; background: #f0f0f0;">
    <h1>Prop Trading Dashboard</h1>
    <p>Sincronizado con Google Sheets</p>
    <div id="resultado">Cargando...</div>
    
    <script>
        fetch('https://script.google.com/macros/s/AKfycbw5subAalhQuoXGDuPG1-m031lAPm-Oz4yl20G_9wxTzgA_ExcohYpC1XiV5q-yw4W-/usercontent?action=getData')
            .then(r => r.json())
            .then(d => {
                document.getElementById('resultado').innerHTML = '<pre>' + JSON.stringify(d, null, 2) + '</pre>';
            })
            .catch(e => {
                document.getElementById('resultado').innerHTML = 'Error: ' + e.message;
            });
    </script>
</body>
</html>
