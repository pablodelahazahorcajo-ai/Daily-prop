<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prop Trading Dashboard</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f0f0f0; }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        header { background: white; padding: 20px; border-radius: 5px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h1 { font-size: 28px; margin-bottom: 10px; }
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-top: 20px; }
        .stat { background: #e8f4f8; padding: 15px; border-radius: 5px; }
        .stat-value { font-size: 24px; font-weight: bold; color: #333; }
        .stat-label { font-size: 12px; color: #666; margin-top: 5px; }
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid #ddd; }
        .tab { padding: 10px 20px; cursor: pointer; border: none; background: none; font-size: 16px; }
        .tab.active { border-bottom: 3px solid #007bff; color: #007bff; font-weight: bold; }
        .content { background: white; padding: 20px; border-radius: 5px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        button { padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 14px; }
        button:hover { background: #0056b3; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        table th, table td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        table th { background: #f5f5f5; font-weight: bold; }
        input, select { padding: 8px; border: 1px solid #ddd; border-radius: 3px; margin: 5px; }
        .form-group { margin: 15px 0; }
        .loading { color: #666; }
        .error { color: red; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📊 Prop Trading Dashboard</h1>
            <p>Sincronizado con Firebase</p>
            <div class="stats">
                <div class="stat">
                    <div class="stat-value" id="totalInvested">$0</div>
                    <div class="stat-label">Total Invertido</div>
                </div>
                <div class="stat">
                    <div class="stat-value" id="activeAccounts">0</div>
                    <div class="stat-label">Cuentas Activas</div>
                </div>
                <div class="stat">
                    <div class="stat-value" id="totalPnL">$0</div>
                    <div class="stat-label">Total P&L</div>
                </div>
            </div>
        </header>

        <div class="tabs">
            <button class="tab active" onclick="switchTab('PABLO')">PABLO</button>
            <button class="tab" onclick="switchTab('JAVI')">JAVI</button>
            <button class="tab" onclick="switchTab('GUILLEM')">GUILLEM</button>
            <button class="tab" onclick="switchTab('ALEX')">ALEX</button>
        </div>

        <div class="content">
            <div style="display: flex; gap: 10px; margin-bottom: 20px;">
                <button onclick="toggleForm()">➕ Agregar Cuenta</button>
                <button onclick="executeDaily()" style="background: #28a745;">▶️ Ejecutar Diario</button>
            </div>

            <div id="formContainer" style="display: none; background: #f9f9f9; padding: 20px; border-radius: 5px; margin-bottom: 20px;">
                <h3>Nueva Cuenta</h3>
                <div class="form-group">
                    <input type="text" id="empresa" placeholder="Empresa" />
                    <input type="text" id="cuenta" placeholder="Cuenta" />
                </div>
                <div class="form-group">
                    <input type="number" id="saldo" placeholder="Saldo" value="100000" />
                    <select id="fase">
                        <option>PAGO</option>
                        <option>WAIT</option>
                        <option>REAL</option>
                        <option value="2">Fase 2</option>
                        <option value="1">Fase 1</option>
                    </select>
                </div>
                <div class="form-group">
                    <input type="number" id="dailyProfit" placeholder="Daily Profit" value="0" />
                    <input type="text" id="activo" placeholder="Activo (XAU, US100...)" />
                </div>
                <button onclick="guardarCuenta()">✓ Guardar</button>
                <button onclick="toggleForm()" style="background: #6c757d;">✕ Cancelar</button>
            </div>

            <div id="loading" class="loading">Cargando datos desde Firebase...</div>
            <table id="tabla" style="display: none;">
                <thead>
                    <tr>
                        <th>Fecha</th>
                        <th>Empresa</th>
                        <th>Cuenta</th>
                        <th>Saldo</th>
                        <th>Fase</th>
                        <th>P&L</th>
                        <th>Activo</th>
                    </tr>
                </thead>
                <tbody id="tbody"></tbody>
            </table>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCt6GxIpUaQa0qgToUKz3LKh01nH0Ny9LI",
            authDomain: "prop-trading1996.firebaseapp.com",
            projectId: "prop-trading1996",
            storageBucket: "prop-trading1996.firebasestorage.app",
            messagingSenderId: "168517447185",
            appId: "1:168517447185:web:8d8b1a0d8ca49b62354bb0",
            measurementId: "G-W7PBHSYCqV"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let currentTrader = 'PABLO';
        let allData = {};

        function switchTab(trader) {
            currentTrader = trader;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            renderTable();
        }

        function toggleForm() {
            const form = document.getElementById('formContainer');
            form.style.display = form.style.display === 'none' ? 'block' : 'none';
        }

        async function guardarCuenta() {
            const cuenta = {
                date: new Date().toLocaleDateString('es-ES'),
                empresa: document.getElementById('empresa').value,
                cuenta: document.getElementById('cuenta').value,
                saldo: parseFloat(document.getElementById('saldo').value),
                fase: document.getElementById('fase').value,
                dailyProfit: parseFloat(document.getElementById('dailyProfit').value),
                activo: document.getElementById('activo').value,
                timestamp: new Date()
            };

            try {
                await db.collection('traders').doc(currentTrader).collection('cuentas').add(cuenta);
                loadData();
                document.getElementById('empresa').value = '';
                document.getElementById('cuenta').value = '';
                document.getElementById('saldo').value = '100000';
                document.getElementById('dailyProfit').value = '0';
                document.getElementById('activo').value = '';
                toggleForm();
                alert('✓ Cuenta guardada en Firebase');
            } catch (error) {
                alert('Error: ' + error.message);
            }
        }

        async function loadData() {
            allData = {};
            const traders = ['PABLO', 'JAVI', 'GUILLEM', 'ALEX'];

            for (const trader of traders) {
                const snapshot = await db.collection('traders').doc(trader).collection('cuentas').orderBy('timestamp', 'desc').get();
                allData[trader] = [];
                snapshot.forEach(doc => {
                    allData[trader].push(doc.data());
                });
            }

            document.getElementById('loading').style.display = 'none';
            document.getElementById('tabla').style.display = 'table';
            renderTable();
            updateStats();
        }

        function renderTable() {
            const cuentas = allData[currentTrader] || [];
            const tbody = document.getElementById('tbody');
            tbody.innerHTML = '';

            cuentas.forEach(cuenta => {
                const row = tbody.insertRow();
                row.innerHTML = `
                    <td>${cuenta.date}</td>
                    <td>${cuenta.empresa}</td>
                    <td>${cuenta.cuenta}</td>
                    <td>$${cuenta.saldo.toLocaleString('es-ES')}</td>
                    <td>${cuenta.fase}</td>
                    <td style="color: ${cuenta.dailyProfit >= 0 ? 'green' : 'red'}">$${cuenta.dailyProfit.toLocaleString('es-ES')}</td>
                    <td>${cuenta.activo || '-'}</td>
                `;
            });
        }

        function updateStats() {
            let totalInvested = 0, activeAccounts = 0, totalPnL = 0;

            Object.values(allData).forEach(arr => {
                (arr || []).forEach(cuenta => {
                    activeAccounts++;
                    totalPnL += cuenta.dailyProfit || 0;
                });
            });

            document.getElementById('totalInvested').textContent = '$' + totalInvested.toLocaleString('es-ES');
            document.getElementById('activeAccounts').textContent = activeAccounts;
            document.getElementById('totalPnL').textContent = '$' + totalPnL.toLocaleString('es-ES');
        }

        function executeDaily() {
            alert('✓ Proceso completado. Los datos están siendo sincronizados con Firebase');
        }

        loadData();
    </script>
</body>
</html>
