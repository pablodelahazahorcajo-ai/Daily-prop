<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: monospace; background: #1a1a1a; color: #0f0; padding: 20px; }
        pre { background: #222; padding: 20px; border-radius: 8px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>Firebase Data Debug</h1>
    <pre id="output">Cargando...</pre>

    <script>
        const PROJECT = 'prop-trading1996';
        const API_KEY = 'AIzaSyCt6GxIpUaQa0qgToUKz3LKh01nH0Ny9LI';

        async function debug() {
            const url = `https://firestore.googleapis.com/v1/projects/${PROJECT}/databases/(default)/documents/traders/PABLO/cuentas?key=${API_KEY}`;
            
            try {
                const res = await fetch(url);
                const data = await res.json();
                const first = data.documents?.[0];
                
                if (!first) {
                    document.getElementById('output').innerText = 'Sin documentos';
                    return;
                }

                const fields = Object.keys(first.fields || {});
                const output = `Total cuentas: ${data.documents.length}\n\nPrimer documento - Campos disponibles:\n${fields.join('\n')}\n\nDatos del primer documento:\n${JSON.stringify(first.fields, null, 2)}`;
                
                document.getElementById('output').innerText = output;
            } catch (e) {
                document.getElementById('output').innerText = 'Error: ' + e.message;
            }
        }

        debug();
    </script>
</body>
</html>
