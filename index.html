<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prop Trading Dashboard - Professional</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #e2e8f0;
            min-height: 100vh;
        }

        .container { max-width: 1600px; margin: 0 auto; }

        header {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(148, 163, 184, 0.1);
            padding: 20px 30px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        h1 { font-size: 24px; font-weight: 600; color: #f1f5f9; }

        .header-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .stat-card {
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.6) 0%, rgba(51, 65, 85, 0.6) 100%);
            border: 1px solid rgba(148, 163, 184, 0.1);
            border-radius: 8px;
            padding: 15px;
            backdrop-filter: blur(10px);
        }

        .stat-label { font-size: 12px; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px; }
        .stat-value { font-size: 24px; font-weight: 700; color: #06b6d4; margin-top: 8px; }

        main { padding: 30px; }

        .tabs {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 10px;
            margin-bottom: 30px;
        }

        .tab-btn {
            padding: 12px 20px;
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid rgba(148, 163, 184, 0.1);
            color: #94a3b8;
            cursor: pointer;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .tab-btn:hover { background: rgba(51, 65, 85, 0.8); color: #cbd5e1; }
        .tab-btn.active { background: #0ea5e9; color: white; border-color: #0ea5e9; }

        .content {
            background: rgba(30, 41, 59, 0.4);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(148, 163, 184, 0.1);
            border-radius: 12px;
            padding: 30px;
        }

        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        button {
            padding: 11px 24px;
            background: linear-gradient(135deg, #0ea5e9 0%, #06b6d4 100%);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        button:hover { transform: translateY(-2px); box-shadow: 0 8px 16px rgba(6, 182, 212, 0.3); }
        button:active { transform: translateY(0); }

        .btn-success { background: linear-gradient(135deg, #10b981 0%, #059669 100%); }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            font-size: 13px;
        }

        th {
            background: rgba(51, 65, 85, 0.8);
            padding: 15px;
            text-align: left;
            font-size: 12px;
            font-weight: 600;
            color: #cbd5e1;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 2px solid rgba(148, 163, 184, 0.2);
            position: sticky;
            top: 0;
        }

        td {
            padding: 14px 15px;
            border-bottom: 1px solid rgba(148, 163, 184, 0.1);
        }

        tr:hover { background: rgba(148, 163, 184, 0.05); }

        .phase-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .phase-pago { background: rgba(245, 158, 11, 0.2); color: #fcd34d; }
        .phase-wait { background: rgba(107, 114, 128, 0.2); color: #d1d5db; }
        .phase-real { background: rgba(59, 130, 246, 0.2); color: #93c5fd; }
        .phase-2 { background: rgba(168, 85, 247, 0.2); color: #d8b4fe; }
        .phase-1 { background: rgba(249, 115, 22, 0.2); color: #fed7aa; }

        .loading { text-align: center; padding: 40px; color: #94a3b8; }
        .empty { text-align: center; padding: 60px 40px; color: #64748b; }

        #profitChart { max-height: 400px; margin: 30px 0; }

        .chart-container {
            background: rgba(51, 65, 85, 0.4);
            border: 1px solid rgba(148, 163, 184, 0.1);
            border-radius: 8px;
            padding: 20px;
            margin: 20px 0;
        }

        .scroll-x { overflow-x: auto; }

        @media (max-width: 768px) {
            .tabs { grid-template-columns: repeat(2, 1fr); }
            table { font-size: 11px; }
            th, td { padding: 10px; }
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <h1>📊 Prop Trading Dashboard</h1>
            <div class="header-stats">
                <div class="stat-card">
                    <div class="stat-label">Cuentas Activas</div>
                    <div class="stat-value" id="activeCounts">260</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Fase REAL</div>
                    <div class="stat-value" id="realCount">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Total Invertido</div>
                    <div class="stat-value" id="totalInvested">$0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">2026 Profit</div>
                    <div class="stat-value" id="totalPnL">$159.073</div>
                </div>
            </div>
        </div>
    </header>

    <main class="container">
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('PABLO')">PABLO (81)</button>
            <button class="tab-btn" onclick="switchTab('JAVI')">JAVI (47)</button>
            <button class="tab-btn" onclick="switchTab('GUILLEM')">GUILLEM (55)</button>
            <button class="tab-btn" onclick="switchTab('ALEX')">ALEX (77)</button>
            <button class="tab-btn" onclick="switchTab('profit')">📈 PROFIT</button>
        </div>

        <div class="content">
            <div class="controls">
                <button class="btn-success" onclick="executeDaily()">▶️ EJECUTAR DIARIO</button>
                <button onclick="exportData()">⬇️ EXPORTAR</button>
            </div>

            <div id="main-content"><div class="loading">Sincronizando con Firebase...</div></div>
            <div id="profit-content" style="display:none;">
                <div class="chart-container"><canvas id="profitChart"></canvas></div>
            </div>
        </div>
    </main>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCt6GxIpUaQa0qgToUKz3LKh01nH0Ny9LI",
            authDomain: "prop-trading1996.firebaseapp.com",
            projectId: "prop-trading1996",
            storageBucket: "prop-trading1996.firebasestorage.app",
            messagingSenderId: "168517447185",
            appId: "1:168517447185:web:8d8b1a0d8ca49b62354bb0"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        let currentTab = 'PABLO';
        let allData = {};

        async function loadData() {
            try {
                for (const trader of ['PABLO', 'JAVI', 'GUILLEM', 'ALEX']) {
                    const snapshot = await db.collection('traders').doc(trader).collection('cuentas').limit(100).get();
                    allData[trader] = snapshot.docs.map(d => ({...d.data(), docId: d.id}));
                }
                renderTable();
                updateStats();
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('main-content').innerHTML = '<div class="empty">Error: ' + error.message + '</div>';
            }
        }

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');

            document.getElementById('main-content').style.display = tab !== 'profit' ? 'block' : 'none';
            document.getElementById('profit-content').style.display = tab === 'profit' ? 'block' : 'none';

            if (tab === 'profit') renderProfitChart();
            else renderTable();
        }

        function renderTable() {
            const accounts = allData[currentTab] || [];
            if (accounts.length === 0) {
                document.getElementById('main-content').innerHTML = '<div class="loading">Cargando ' + currentTab + '...</div>';
                return;
            }

            let html = '<div class="scroll-x"><table><thead><tr>';
            html += '<th>Cuenta</th><th>Empresa</th><th>APP</th><th>TD Loss</th><th>NO News</th><th>Daily</th><th>Max DD</th><th>PT1</th><th>PT2</th><th>NDX</th><th>Saldo</th><th>Cierre</th><th>TDs</th><th>Fase</th><th>Activo</th><th>Precio</th><th>Retiro</th><th>Notas</th></tr></thead><tbody>';

            accounts.forEach(acc => {
                const fase = (acc.Fase || 'WAIT').toUpperCase();
                const faseClass = 'phase-' + fase.toLowerCase();
                html += `<tr>
                    <td>${acc.Cuenta || '-'}</td>
                    <td>${acc.Empresa || '-'}</td>
                    <td>${acc.APP || '-'}</td>
                    <td>${acc['TD Loss'] || '-'}</td>
                    <td>${acc['NO News'] || '-'}</td>
                    <td>${acc.Daily || '5%'}</td>
                    <td>${acc['Max DD'] || '10%'}</td>
                    <td>${acc['PT 1'] || '8%'}</td>
                    <td>${acc['PT 2'] || '5%'}</td>
                    <td>${acc.NDX || '-'}</td>
                    <td>${acc.Saldo || '$0'}</td>
                    <td>${acc.Cierre || '-'}</td>
                    <td>${acc.TDs || '0/0'}</td>
                    <td><span class="phase-badge ${faseClass}">${fase}</span></td>
                    <td>${acc.Activo || '-'}</td>
                    <td>${acc.Precio || '$0'}</td>
                    <td>${acc.Retiro || '$0'}</td>
                    <td>${acc.Notas || ''}</td>
                </tr>`;
            });

            html += '</tbody></table></div>';
            document.getElementById('main-content').innerHTML = html;
        }

        function renderProfitChart() {
            const months = ['Ene', 'Feb', 'Mar', 'Abr', 'May', 'Jun', 'Jul', 'Ago', 'Sep'];
            const ctx = document.getElementById('profitChart');
            if (!ctx) return;

            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: months,
                    datasets: [
                        {label: 'PABLO', data: [17400, 11355, 24600, 27263, 19266, 31741, 24632, 13481, 3201], borderColor: '#0ea5e9', tension: 0.3},
                        {label: 'JAVI', data: [1700, 5540, 10600, 1130, 8240, 4760, 8120, 13300, 0], borderColor: '#10b981', tension: 0.3},
                        {label: 'GUILLEM', data: [8500, 9670, 8815, 10045, 5490, 9350, 9220, 6590, 0], borderColor: '#f59e0b', tension: 0.3},
                        {label: 'ALEX', data: [12000, 6105, 11730, 12420, 2815, 15200, 13745, 13860, 0], borderColor: '#a855f7', tension: 0.3}
                    ]
                },
                options: {
                    responsive: true,
                    plugins: {legend: {labels: {color: '#cbd5e1'}}},
                    scales: {
                        y: {ticks: {color: '#94a3b8'}, grid: {color: 'rgba(148, 163, 184, 0.1)'}},
                        x: {ticks: {color: '#94a3b8'}, grid: {color: 'rgba(148, 163, 184, 0.1)'}}
                    }
                }
            });
        }

        function updateStats() {
            document.getElementById('realCount').innerText = '32';
        }

        async function executeDaily() {
            alert('✅ Ejecutar Diario activado\n\n⚠️ Función en desarrollo');
        }

        function exportData() {
            const json = JSON.stringify(allData, null, 2);
            const blob = new Blob([json], {type: 'application/json'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'prop-trading-export.json';
            a.click();
        }

        loadData();
    </script>
</body>
</html>
